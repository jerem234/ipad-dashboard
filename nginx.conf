server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Always serve fresh files so edits (especially quotes.txt) show up on the iPad
    add_header Cache-Control "no-cache";

    # Upcoming events from the calendar container. Looked up at request time,
    # so the dashboard still works if that container is stopped.
    location = /api/calendar {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $calendar http://calendar:8000;
        proxy_pass $calendar;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ^~ /server/ {
        return 404;
    }

    location ~ /(docker-compose\.yml|nginx\.conf|README\.md|caldav\.env.*)$ {
        return 404;
    }
}
